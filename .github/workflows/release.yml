name: Release plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  windows-hello:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build native Windows Hello bridge
        run: node scripts/build-hello.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-hello-embedded
          path: src/passwords/native.generated.ts
  release:
    needs: windows-hello
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: windows-hello-embedded
          path: src/passwords

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const tag = process.env.RELEASE_TAG.replace(/^v/, '');
          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const manifestVersion = JSON.parse(readFileSync('manifest.json', 'utf8')).version;

          if (tag !== packageVersion || tag !== manifestVersion) {
            throw new Error(`Tag (${tag}), package.json (${packageVersion}), and manifest.json (${manifestVersion}) must match.`);
          }
          NODE

      - name: Build plugin
        run: npm run verify

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--title "$RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            "${args[@]}" \
            dist/main.js dist/manifest.json dist/styles.css
