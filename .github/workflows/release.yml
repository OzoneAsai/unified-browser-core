name: Release plugin

on:
  push:
    tags:
      - "*"
    branches:
      - main
    paths:
      - "package.json"
      - "manifest.json"

concurrency:
  group: ubc-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-hello:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build native Windows Hello bridge
        run: node scripts/build-hello.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-hello-embedded
          path: src/passwords/native.generated.ts
  release:
    needs: windows-hello
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: windows-hello-embedded
          path: src/passwords

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(node -p "require('./package.json').version")"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            should_release=false
          else
            should_release=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

      - name: Verify release version
        if: steps.release.outputs.should_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const tag = process.env.RELEASE_TAG.replace(/^v/, '');
          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const manifestVersion = JSON.parse(readFileSync('manifest.json', 'utf8')).version;

          if (tag !== packageVersion || tag !== manifestVersion) {
            throw new Error(`Tag (${tag}), package.json (${packageVersion}), and manifest.json (${manifestVersion}) must match.`);
          }
          NODE

      - name: Typecheck plugin
        if: steps.release.outputs.should_release == 'true'
        run: npm run typecheck

      - name: Run smoke tests
        if: steps.release.outputs.should_release == 'true'
        run: npm test

      - name: Build plugin
        if: steps.release.outputs.should_release == 'true'
        run: npm run verify

      - name: Publish GitHub release
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          args=(--title "$RELEASE_TAG" --generate-notes --target "$GITHUB_SHA")
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            "${args[@]}" \
            dist/main.js dist/manifest.json dist/styles.css
