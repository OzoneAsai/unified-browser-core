name: Release plugin

on:
  push:
    tags:
      - "*"
    branches:
      - main
    paths:
      - "package.json"
      - "manifest.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            should_release=true
          else
            tag="$(node -p "require('./package.json').version")"
            if gh release view "$tag" >/dev/null 2>&1; then
              should_release=false
            else
              should_release=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

      - name: Verify release version
        if: steps.release.outputs.should_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const tag = process.env.RELEASE_TAG.replace(/^v/, '');
          const packageVersion = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const manifestVersion = JSON.parse(readFileSync('manifest.json', 'utf8')).version;

          if (tag !== packageVersion || tag !== manifestVersion) {
            throw new Error(`Tag (${tag}), package.json (${packageVersion}), and manifest.json (${manifestVersion}) must match.`);
          }
          NODE

      - name: Typecheck plugin
        if: steps.release.outputs.should_release == 'true'
        run: npm run typecheck

      - name: Run smoke tests
        if: steps.release.outputs.should_release == 'true'
        run: npm test

      - name: Build plugin
        if: steps.release.outputs.should_release == 'true'
        run: npm run build

      - name: Publish GitHub release
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          args=(--title "$RELEASE_TAG" --generate-notes --target "$GITHUB_SHA")
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            "${args[@]}" \
            dist/main.js dist/manifest.json dist/styles.css
